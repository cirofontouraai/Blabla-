name: Gerar APK do BlaBla-

on:
  push:
    branches: [ "principal", "main" ]
  workflow_dispatch: # Permite que você clique em um botão para gerar o APK manualmente

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Pegar o código do repositório
      uses: actions/checkout@v4

    - name: Configurar o ambiente Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: gradle

        - name: Dar permissão de execução para o Gradle
      run: chmod +x gradlew
      working-directory: aplicativo

    - name: Compilar o APK de Teste (Debug)
      run: ./gradlew assembleDebug
      working-directory: aplicativo

    - name: Guardar o arquivo APK gerado
      uses: actions/upload-artifact@v4
      with:
        name: Pool-Go-Car-App
        path: aplicativo/app/build/outputs/apk/debug/app-debug.apk


