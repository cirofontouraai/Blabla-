name: Gerar APK do BlaBla-

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Pegar o código do repositório
      uses: actions/checkout@v4

    - name: Configurar o ambiente Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: gradle

    - name: Dar permissão de execução para o Gradle
      run: chmod +x gradlew

    - name: Compilar o APK de Teste (Debug)
      run: ./gradlew assembleDebug

    - name: Guardar o arquivo APK gerado
      uses: actions/upload-artifact@v4
      with:
        name: Blabla-App-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
