name: Gerar APK do BlaBla-

on:
  push:
    branches: [ "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Pegar o código do repositório
      uses: actions/checkout@v4

    - name: Configurar o ambiente Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Configurar o Gradle automaticamente
      uses: gradle/actions/setup-gradle@v4

    - name: Compilar o APK de Teste (Debug)
      run: gradle :aplicativo:assembleDebug

    - name: Guardar o arquivo APK gerado
      uses: actions/upload-artifact@v4
      with:
        name: Blabla-App-Debug
        path: aplicativo/build/outputs/apk/debug/aplicativo-debug.apk

